<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agent Boss · Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ink: #081517;
    --deep: #0d2023;
    --lime: #adff00;
    --gold: #ffd23f;
    --text: #ffffff;
    --mute: #93b5ba;
    --pix: "Silkscreen", "Courier New", monospace;
    --mono: "JetBrains Mono", ui-monospace, monospace;
    --sans: "Trebuchet MS", system-ui, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }
  @media (hover: hover) and (pointer: fine) { body { cursor: none; } }
  .scr {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    box-sizing: border-box;
    overflow: hidden;
    background: var(--ink);
  }
  .glow {
    position: absolute;
    left: 50%;
    top: -20vh;
    width: min(800px, 120vw);
    height: 85vh;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(closest-side, #15313a, #0f2529b3 60%, #08151700);
    pointer-events: none;
  }
  .floor {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 28vh;
    background: var(--deep);
    border-top: 3px solid var(--lime);
    overflow: hidden;
    pointer-events: none;
  }
  .grid {
    position: absolute;
    left: -50%;
    right: -50%;
    top: 0;
    height: 300%;
    transform-origin: top;
    transform: perspective(320px) rotateX(58deg);
    background-image:
      linear-gradient(90deg, rgba(173,255,0,.15) 2px, transparent 2px),
      linear-gradient(rgba(173,255,0,.15) 2px, transparent 2px);
    background-size: 64px 64px;
  }
  h1, .brand, #list, .foot { position: relative; z-index: 1; }
  h1 {
    margin: clamp(4px, 2vh, 28px) 0 0;
    text-align: center;
    font-family: var(--pix);
    font-weight: 700;
    font-size: clamp(30px, min(8vw, 8.5vh), 72px);
    line-height: 1.1;
    color: var(--lime);
    text-shadow: 0 .08em 0 rgba(79,127,0,.8);
  }
  .brand {
    margin: clamp(4px, 1vh, 12px) 0 clamp(10px, 2.5vh, 28px);
    text-align: center;
    line-height: 1.1;
  }
  .brand-main {
    display: block;
    font-family: var(--pix);
    font-weight: 700;
    font-size: clamp(20px, 3.2vh, 32px);
    letter-spacing: 1px;
    color: var(--lime);
    text-shadow: 0 .12em 0 rgba(79, 127, 0, .8);
  }
  .brand-sub {
    display: block;
    margin-top: 4px;
    font-family: var(--pix);
    font-weight: 700;
    font-size: clamp(12px, 2vh, 18px);
    color: #fff;
    text-shadow: 0 .1em 0 rgba(79, 127, 0, .55);
  }
  #list {
    --row: clamp(15px, min(2.6vh, 4.2vw), 40px);
    flex: 1 1 auto;
    min-height: 0;
    width: min(100%, 36em);
    display: flex;
    flex-direction: column;
    gap: clamp(4px, .9vh, 10px);
    overflow-y: auto;
    scrollbar-width: none;
    font-size: var(--row);
  }
  #list::-webkit-scrollbar { display: none; }
  .row {
    flex: none;
    display: grid;
    grid-template-columns: 2.4em minmax(0, 1fr) auto;
    align-items: center;
    gap: .7em;
    background: rgba(13,32,35,.92);
    border: 2px solid rgba(255,255,255,.1);
    border-radius: 10px;
    padding: .35em .85em;
    animation: in .35s ease-out both;
  }
  .row.top { border-color: rgba(255,210,63,.6); }
  .row.fresh { border-color: var(--lime); box-shadow: 0 0 18px rgba(173,255,0,.35); }
  .rank { font-family: var(--mono); font-weight: 700; font-size: 1.05em; color: var(--mute); }
  .row.top .rank { color: var(--gold); }
  .who { display: flex; align-items: center; gap: .5em; min-width: 0; }
  .who i { width: .65em; height: .65em; border-radius: 3px; flex: none; }
  .who span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who b { font-size: 1em; }
  .who small::before { content: "· "; }
  .who small { font-size: .72em; font-weight: 700; color: var(--mute); }
  .score { font-family: var(--mono); font-weight: 700; font-size: 1.15em; color: var(--lime); }
  @media (max-width: 520px) {
    .who span { display: flex; flex-direction: column; line-height: 1.2; }
    .who small { font-size: .7em; }
    .who small::before { content: none; }
  }
  .empty {
    text-align: center;
    margin-top: 12vh;
    font-family: var(--pix);
    font-size: clamp(16px, 3vh, 26px);
    color: var(--mute);
  }
  .foot {
    flex: none;
    padding-top: clamp(6px, 1.5vh, 16px);
    text-align: center;
    font-family: var(--mono);
    font-size: clamp(10px, 1.6vh, 13px);
    color: var(--mute);
  }
  .foot.err { color: #ff6b6b; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
</style>
</head>
<body>
<div class="scr">
    <div class="glow"></div>
    <div class="floor"><div class="grid"></div></div>
    <h1>SCOREBOARD</h1>
    <div class="brand">
      <span class="brand-main">AGENT BOSS</span>
      <span class="brand-sub">THE BORREL BATTLE</span>
    </div>
    <div id="list"></div>
    <div class="foot" id="foot">Laden…</div>
</div>
<script>
  const POLL_MS = 30000;
  const LIMIT = Math.min(Math.max(parseInt(new URLSearchParams(location.search).get("n") || "10", 10) || 10, 1), 50);
  const list = document.getElementById("list");
  const foot = document.getElementById("foot");
  let known = null;

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const fmt = (n) => Number(n || 0).toLocaleString("nl-NL");
  const color = (c) => (/^#[0-9a-f]{3,8}$/i.test(c || "") ? c : "#adff00");

  function render(rows) {
    const ids = new Set(rows.map((r) => r.rid));
    if (!rows.length) {
      list.innerHTML = `<div class="empty">Nog geen scores. Wie begint?</div>`;
    } else {
      list.innerHTML = rows.map((r, i) => {
        const fresh = known && !known.has(r.rid);
        const cls = ["row", i === 0 ? "top" : "", fresh ? "fresh" : ""].join(" ");
        return `<div class="${cls}" style="animation-delay:${(i * 0.05).toFixed(2)}s">
          <span class="rank">${i + 1}</span>
          <span class="who"><i style="background:${color(r.kleur)}"></i><span><b>${esc(r.agent)}</b> <small>${esc(r.speler)}</small></span></span>
          <span class="score">${fmt(r.score)}</span>
        </div>`;
      }).join("");
    }
    known = ids;
  }

  async function load() {
    try {
      const res = await fetch(`/api/scoreboard?n=${LIMIT}`, { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { rows = [] } = await res.json();
      render(rows);
      foot.className = "foot";
      foot.textContent = `Bijgewerkt ${new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" })}`;
    } catch (err) {
      foot.className = "foot err";
      foot.textContent = "Scoreboard tijdelijk niet bereikbaar, opnieuw proberen…";
    }
  }

  load();
  setInterval(load, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
